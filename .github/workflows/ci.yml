name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
      - run: go test -race ./...

  bench:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: HIVE_BENCH=1 go test ./bench -run xxx -bench 'Hook' -benchtime 50x -timeout 60m
      - run: HIVE_BENCH=1 go test ./bench -run xxx -bench 'SkillSearch|RecallAtScale|Build1M' -benchtime 1x -timeout 60m
