version: 2

project_name: inscribe

builds:
  - id: inscribe
    main: ./cmd/inscribe
    binary: inscribe
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git

homebrew_casks:
  - repository:
      owner: a6n-ai
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}true{{ end }}'
    homepage: https://github.com/a6n-ai/inscribe
    description: Shared memory for coding agents
    license: Apache-2.0
    binaries:
      - inscribe
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/inscribe"]
          end
