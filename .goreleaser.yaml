version: 2

project_name: hive

builds:
  - id: hive
    main: ./cmd/hive
    binary: hive
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git

homebrew_casks:
  - repository:
      owner: a6n-ai
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}true{{ end }}'
    homepage: https://github.com/a6n-ai/hive
    description: Shared memory for coding agents
    license: Apache-2.0
    binaries:
      - hive
